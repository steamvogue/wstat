# Sanitized Debian-style Apache main config for scanner tests.
# Includes are relative and resolve against this fixture directory.
ServerName localhost
ErrorLog ${APACHE_LOG_DIR}/error.log

LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined

# global catch-all log for vhosts without their own CustomLog
CustomLog ${APACHE_LOG_DIR}/other_vhosts_access.log vhost_combined

IncludeOptional sites-enabled/*.conf
IncludeOptional missing-but-optional-does-not-warn.conf
