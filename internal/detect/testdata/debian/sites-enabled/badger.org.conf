<VirtualHost *:80>
	ServerName badger.org
	ServerAlias badger.net

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/badger.org

	<Directory /var/www/badger.org>
		Options FollowSymLinks
	        AllowOverride All
		Require all granted
	</Directory>

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/badger.org-error.log
	CustomLog ${APACHE_LOG_DIR}/badger.org-access.log combined

	#Include conf-available/serve-cgi-bin.conf
</VirtualHost>
