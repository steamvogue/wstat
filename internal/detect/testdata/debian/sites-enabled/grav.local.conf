<VirtualHost *:80>
	ServerName grav.local
	ServerAlias grav.home

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/grav.local

	<Directory /var/www/grav.local>
		Options FollowSymLinks
	        AllowOverride All
		Require all granted
	</Directory>

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/grav.local-error.log
	CustomLog ${APACHE_LOG_DIR}/grav.local-access.log combined

	#Include conf-available/serve-cgi-bin.conf
</VirtualHost>
