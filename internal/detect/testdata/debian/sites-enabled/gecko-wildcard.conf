<VirtualHost *:80>
    ServerName wildcard.gecko.net
    ServerAlias *.gecko.net *.gecko.org

    UseCanonicalName Off
    VirtualDocumentRoot /var/www/gecko/%1/

    <Directory /var/www/gecko>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gecko-wildcard-error.log
    CustomLog ${APACHE_LOG_DIR}/gecko-wildcard-access.log combined
</VirtualHost>


<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName admin.gecko.net
    ServerAlias *.gecko.net

    UseCanonicalName Off
    VirtualDocumentRoot /var/www/gecko/%1/

    SSLEngine On
    SSLCertificateFile /etc/ssl/localcerts/gecko/gecko-net.pem
    SSLCertificateKeyFile /etc/ssl/localcerts/gecko/gecko-net-key.pem

    <Directory /var/www/gecko>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gecko-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/gecko-ssl-access.log combined
</VirtualHost>
</IfModule>
