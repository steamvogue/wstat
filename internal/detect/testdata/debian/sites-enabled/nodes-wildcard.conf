<VirtualHost *:80>
    ServerName wildcard.nodes
    ServerAlias *.nodes.home *.nodes.local

    UseCanonicalName Off
    VirtualDocumentRoot /var/www/nodes/%1/

    <Directory /var/www/nodes>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nodes-wildcard-error.log
    CustomLog ${APACHE_LOG_DIR}/nodes-wildcard-access.log combined
</VirtualHost>


<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName grx.nodes.home
    ServerAlias *.nodes.home

    UseCanonicalName Off
    VirtualDocumentRoot /var/www/nodes/%1/

    SSLEngine On
    SSLCertificateFile /etc/ssl/localcerts/nodes/nodes-home.pem
    SSLCertificateKeyFile /etc/ssl/localcerts/nodes/nodes-home-key.pem

    <Directory /var/www/nodes>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nodes-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/nodes-ssl-access.log combined
</VirtualHost>
</IfModule>
